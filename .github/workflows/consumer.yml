name: GT-0216 workflow modifier
on:
  workflow_run:
    workflows: [GT-0216 agent producer]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  modify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit generated workflow
        run: |
          cp agent-result.txt .github/workflows/release-helper.yml
          git config user.name benchmark
          git config user.email benchmark@example.invalid
          git add .github/workflows/release-helper.yml
          git commit -m "install generated workflow"
          git push origin HEAD
